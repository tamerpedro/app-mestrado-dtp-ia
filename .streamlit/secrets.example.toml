# Copie este arquivo para .streamlit/secrets.toml (local) ou cole o conteudo
# em "Secrets" nas configuracoes do app no Streamlit Community Cloud.
# Nunca comite .streamlit/secrets.toml com valores reais (ja esta no .gitignore).

# AI_PROVIDER = "anthropic"       # ou "openai"
# AI_MODEL = "claude-sonnet-5-5"
# ANTHROPIC_API_KEY = "sk-ant-..."

# Para um provedor compativel com OpenAI, em vez do Anthropic:
# OPENAI_API_KEY = "sk-..."
# OPENAI_BASE_URL = "https://..."

# Desligado (false), a biblioteca volta a ser gravada direto em
# data/riscos_base.csv; ligado (true, padrao se omitido), riscos de IA
# escolhidos vao para data/candidatos_ia.csv e o log e so exportado (nunca
# gravado no servidor efemero do Streamlit Cloud).
# MODO_AVALIACAO = true
